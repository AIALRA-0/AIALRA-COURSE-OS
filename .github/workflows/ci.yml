name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Type check
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Public and writing policy scans
        run: |
          pnpm verify:writing
          pnpm verify:public
      - name: Validate deployment template
        run: docker compose --env-file deploy/vps/.env.example -f deploy/vps/compose.yaml config --quiet
