name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: course_os_test
          POSTGRES_USER: course_os_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U course_os_test -d course_os_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      COURSE_OS_TEST_DATABASE_URL: postgresql://course_os_test@127.0.0.1:5432/course_os_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Type check
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Public and writing policy scans
        run: |
          pnpm verify:writing
          pnpm verify:public --history
      - name: Isolated reading and persistence across API restarts
        run: pnpm exec tsx scripts/verify-reading-stability.ts
      - name: Validate deployment template
        run: docker compose --env-file deploy/vps/.env.example -f deploy/vps/compose.yaml config --quiet
