<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title description">
  <title id="title">Course OS synthetic course player</title>
  <desc id="description">A synthetic interface showing one lesson visual on the left and structured teacher explanation on the right</desc>
  <rect width="1440" height="810" rx="28" fill="#eef1f5"/>
  <rect x="18" y="18" width="1404" height="72" rx="16" fill="#ffffff" stroke="#dfe4ea"/>
  <rect x="38" y="33" width="42" height="42" rx="11" fill="#b83a32"/>
  <text x="59" y="61" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">CO</text>
  <text x="96" y="52" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#18212f">Course OS</text>
  <text x="96" y="72" font-family="Arial, sans-serif" font-size="12" fill="#667085">Synthetic Algorithms · Binary Search</text>
  <rect x="1004" y="35" width="270" height="38" rx="9" fill="#f5f7fa" stroke="#dfe4ea"/>
  <text x="1022" y="59" font-family="Arial, sans-serif" font-size="14" fill="#18212f">Algorithms · version 1</text>
  <rect x="18" y="104" width="800" height="688" rx="18" fill="#20242c"/>
  <rect x="38" y="166" width="760" height="548" rx="12" fill="#ffffff"/>
  <text x="84" y="226" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#18212f">Binary Search</text>
  <text x="84" y="258" font-family="Arial, sans-serif" font-size="16" fill="#667085">Find a target in a sorted array</text>
  <line x1="110" y1="420" x2="727" y2="420" stroke="#b9c1cc" stroke-width="4"/>
  <g font-family="Arial, sans-serif" font-size="20" text-anchor="middle">
    <rect x="110" y="362" width="82" height="82" rx="8" fill="#f5f7fa" stroke="#dfe4ea"/><text x="151" y="411" fill="#18212f">2</text>
    <rect x="199" y="362" width="82" height="82" rx="8" fill="#f5f7fa" stroke="#dfe4ea"/><text x="240" y="411" fill="#18212f">5</text>
    <rect x="288" y="362" width="82" height="82" rx="8" fill="#f5f7fa" stroke="#dfe4ea"/><text x="329" y="411" fill="#18212f">8</text>
    <rect x="377" y="350" width="82" height="106" rx="8" fill="#fff0ee" stroke="#b83a32" stroke-width="3"/><text x="418" y="411" fill="#8f2924" font-weight="700">12</text>
    <rect x="466" y="362" width="82" height="82" rx="8" fill="#f5f7fa" stroke="#dfe4ea"/><text x="507" y="411" fill="#18212f">16</text>
    <rect x="555" y="362" width="82" height="82" rx="8" fill="#f5f7fa" stroke="#dfe4ea"/><text x="596" y="411" fill="#18212f">23</text>
    <rect x="644" y="362" width="82" height="82" rx="8" fill="#f5f7fa" stroke="#dfe4ea"/><text x="685" y="411" fill="#18212f">31</text>
  </g>
  <path d="M418 320 L418 344" stroke="#0b6f68" stroke-width="4"/><path d="M407 330 L418 344 L429 330" fill="none" stroke="#0b6f68" stroke-width="4"/>
  <text x="418" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0b6f68">middle</text>
  <text x="84" y="530" font-family="Arial, sans-serif" font-size="17" fill="#18212f">Target = 23, so discard the left half and continue right</text>
  <rect x="834" y="104" width="588" height="688" rx="18" fill="#ffffff" stroke="#dfe4ea"/>
  <text x="876" y="158" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#b83a32">LESSON 01</text>
  <text x="876" y="198" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#18212f">Why binary search works</text>
  <rect x="876" y="230" width="504" height="112" rx="14" fill="#eaf5f4"/>
  <rect x="876" y="230" width="5" height="112" rx="2" fill="#0b6f68"/>
  <text x="902" y="263" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#18212f">Learning objective</text>
  <text x="902" y="292" font-family="Arial, sans-serif" font-size="14" fill="#18212f">Explain the invariant and predict which half remains</text>
  <text x="902" y="316" font-family="Arial, sans-serif" font-size="14" fill="#18212f">after each comparison</text>
  <text x="876" y="392" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#18212f">Teacher explanation</text>
  <text x="876" y="426" font-family="Arial, sans-serif" font-size="15" fill="#344054">The array is sorted, so one comparison removes every</text>
  <text x="876" y="450" font-family="Arial, sans-serif" font-size="15" fill="#344054">value that cannot equal the target</text>
  <rect x="876" y="488" width="504" height="88" rx="14" fill="#fff4f2"/>
  <text x="902" y="521" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#8f2924">Common mistake</text>
  <text x="902" y="550" font-family="Arial, sans-serif" font-size="14" fill="#18212f">Updating the wrong boundary can repeat the same middle</text>
  <rect x="876" y="608" width="504" height="112" rx="14" fill="#f5f7fa" stroke="#dfe4ea"/>
  <text x="902" y="641" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#18212f">Check your understanding</text>
  <text x="902" y="670" font-family="Arial, sans-serif" font-size="14" fill="#344054">If middle is smaller than target, which boundary changes</text>
  <rect x="902" y="690" width="148" height="12" rx="6" fill="#b83a32"/>
</svg>
