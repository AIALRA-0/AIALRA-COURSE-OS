openapi: 3.1.0
info:
  title: Course OS Browser API
  version: 2.4.0
  description: Browser-facing API; it does not expose ReadWeave internal storage
servers:
  - url: /api/v1
paths:
  /modules:
    post:
      operationId: createModule
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courseId, title]
              properties:
                courseId: { type: string }
                title: { type: string, minLength: 1 }
      responses:
        '201': { description: Module created in ReadWeave }
  /tree/nodes/{id}:
    patch:
      operationId: renameTreeNode
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision, title]
              properties:
                expectedRevision: { type: integer, minimum: 0 }
                title: { type: string, minLength: 1 }
                parentId: { type: [string, 'null'] }
                sortOrder: { type: number }
                archived: { type: boolean }
      responses:
        '200': { description: Node renamed and read back }
        '409': { description: Node revision conflict }
  /tree/nodes/{id}:duplicate:
    post:
      operationId: duplicateTreeNode
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Node duplicated as a draft }
  /tree/nodes/{id}:move:
    post:
      operationId: moveTreeNode
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision]
              properties:
                expectedRevision: { type: integer, minimum: 0 }
                parentId: { type: [string, 'null'], description: Null moves a material to workspace root }
                sortOrder: { type: number }
      responses:
        '200': { description: Node moved and read back }
        '409': { description: Node revision or parent conflict }
  /tree/nodes/{id}:trash:
    post:
      operationId: trashTreeNode
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Node moved to the recoverable trash }
        '409': { description: Published node cannot be deleted in place }
  /trash:
    get:
      operationId: listTrash
      responses:
        '200': { description: Recoverable deleted nodes }
  /trash/{id}:restore:
    post:
      operationId: restoreTrashNode
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                restoreMode: { type: string, enum: [original, root], default: original }
      responses:
        '200': { description: Node restored to its original parent or workspace root }
  /trash/{id}:
    delete:
      operationId: permanentlyDeleteTrashNode
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Trash record and its removable data permanently deleted }
  /readweave/links/{id}:
    get:
      operationId: getVerifiedReadWeaveLink
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200': { description: Verified deep link to the exact ReadWeave note }
        '404': { description: Note not found in the Course OS workspace }
  /settings:
    get:
      operationId: getWorkspaceSettings
      responses:
        '200': { description: Workspace preferences and provider status }
    patch:
      operationId: updateWorkspaceSettings
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Workspace preferences saved }
  /model-providers/{id}/credential:
    put:
      operationId: saveModelProviderCredential
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              properties:
                secret: { type: string, minLength: 1, writeOnly: true }
      responses:
        '200': { description: Credential saved without returning the secret }
  /model-providers/{id}:
    patch:
      operationId: updateModelProvider
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                baseUrl: { type: string }
                enabled: { type: boolean }
      responses:
        '200': { description: Provider endpoint and enabled state saved }
        '422': { description: Unsafe or invalid endpoint rejected }
  /model-providers/{id}:test:
    post:
      operationId: testModelProvider
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200': { description: Provider connectivity and capability test }
  /model-providers/models:
    get:
      operationId: listModelProviderModels
      responses:
        '200': { description: Available configured provider models }
  /model-route-policy:
    get:
      operationId: getModelRoutePolicy
      responses:
        '200': { description: Current model routing policy }
    put:
      operationId: updateModelRoutePolicy
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Model routing policy saved }
  /workspaces/{id}/tree:
    get:
      operationId: getWorkspaceTree
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - name: view
          in: query
          required: false
          schema: { type: string, enum: [library], default: library }
      responses:
        '200': { description: Library tree containing only courses, materials and one top-level trash node; version and page records are accessed through material views }
  /courses:
    get:
      operationId: listCourses
      responses:
        '200': { description: Courses in the current workspace }
    post:
      operationId: createCourse
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Course and ReadWeave tree created }
        '422': { description: Invalid course definition }
  /pages/{id}/draft:
    get:
      operationId: getPageDraft
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200': { description: Current ReadWeave draft or virtual release draft }
    patch:
      operationId: updatePageDraft
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Draft saved and read back }
        '409': { description: Three-way revision conflict created }
  /pages/{id}/lesson:
    get:
      operationId: getPageLesson
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200': { description: Fixed release lesson and saved page QA records }
        '404': { description: Page not found }
  /pages/{id}:validate:
    post:
      operationId: validatePageDraft
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200': { description: Deterministic coverage and publication result }
  /tree/nodes/{id}/properties:
    get:
      operationId: getTreeNodeProperties
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200': { description: Node properties and verified ReadWeave state }
        '404': { description: Tree node not found }
  /tree/nodes/{id}/versions:
    get:
      operationId: getTreeNodeVersions
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200': { description: Read-only release and draft history for a course or material }
        '404': { description: Material entry not found }
  /review-map:
    get:
      operationId: getReviewMap
      responses:
        '200': { description: All objectives from current formal releases and their mastery evidence }
  /review-plans:
    post:
      operationId: createReviewPlan
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, objectiveIds, seed, budgetUsd]
              properties:
                source: { type: string, enum: [due, manual] }
                objectiveIds: { type: array, minItems: 1, items: { type: string } }
                seed: { type: string, minLength: 1 }
                budgetUsd: { type: number, exclusiveMinimum: 0, maximum: 8 }
      responses:
        '201': { description: Review plan prepared from explicitly selected objectives }
        '202': { description: Plan is waiting for ReadWeave synchronization }
        '422': { description: Selected objectives or budget are invalid }
  /review-plans/{id}:
    get:
      operationId: getReviewPlan
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200': { description: Review plan, question selection, cost and sync state }
        '404': { description: Review plan not found }
  /review-plans/{id}/events:
    get:
      operationId: getReviewPlanEvents
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200': { description: Ordered plan preparation and synchronization events }
  /review-plans/{id}:start:
    post:
      operationId: startReviewPlan
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Review session created from a ready plan }
        '409': { description: Plan is not ready or ReadWeave is offline }
  /review-plans/{id}:retry:
    post:
      operationId: retryReviewPlan
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Failed plan prepared again }
  /review-plans/{id}:cancel:
    post:
      operationId: cancelReviewPlan
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Unstarted plan cancelled }
  /review-sessions:
    post:
      operationId: createReviewSession
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Review session created }
        '422': { description: No eligible objective }
  /review-sessions/{id}:
    get:
      operationId: getReviewSession
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200': { description: Review session and current objective }
        '404': { description: Review session not found }
  /review-sessions/{id}/attempts:
    post:
      operationId: submitReviewSessionAttempt
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Attempt saved and mastery updated }
  /review-sessions/{id}/skip:
    post:
      operationId: skipReviewSessionObjective
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Objective skipped and session advanced }
  /review-sessions/current:
    get:
      operationId: getCurrentReviewSession
      responses:
        '200': { description: Current recoverable review session or null }
  /releases:
    get:
      operationId: listReleases
      responses:
        '200': { description: Immutable releases }
    post:
      operationId: publishRelease
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: New immutable release }
        '422': { description: Quality gate failed }
  /sync/status:
    get:
      operationId: getReadWeaveSyncStatus
      responses:
        '200': { description: Authority connection, conflicts and last read/write }
  /conflicts:
    get:
      operationId: listConflicts
      responses:
        '200': { description: Open and resolved three-way conflicts }
  /conflicts/{id}:resolve:
    post:
      operationId: resolveConflict
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Conflict resolved without discarding either version }
  /imports:
    post:
      operationId: createImport
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                source: { type: string }
                license: { type: string }
                courseId: { type: string }
                parentNodeId: { type: string, description: Course or material parent for the imported material }
                qualityMode: { type: string, enum: [economy, balanced, quality] }
                language: { type: string }
      responses:
        '201': { description: Accepted import }
        '422': { description: Quarantined import }
  /imports/{id}/events:
    get:
      operationId: streamImportEvents
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200':
          description: Ordered server-sent event stream
          content:
            text/event-stream: {}
  /imports/{id}:
    get:
      operationId: getImport
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200': { description: Current conversion and ReadWeave draft-sync state }
        '404': { description: Import not found }
    delete:
      operationId: deleteImport
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '204': { description: Import and its exact ReadWeave draft-source tree removed, or already absent }
        '409': { description: Import is not failed or quarantined and cannot be deleted }
  /generation-jobs:
    post:
      operationId: createGenerationJob
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [materialVersionId, pageIds, budgetUsd]
              properties:
                materialVersionId: { type: string, minLength: 1 }
                pageIds: { type: array, items: { type: string } }
                budgetUsd: { type: number, exclusiveMinimum: 0, maximum: 8 }
      responses:
        '202': { description: Queued job }
  /generation-jobs/{id}:cancel:
    post:
      operationId: cancelGenerationJob
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200': { description: Cancelled or already terminal job }
  /generation-jobs/{id}:
    get:
      operationId: getGenerationJob
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200': { description: Durable generation job state and page progress }
        '404': { description: Job not found }
  /generation-jobs/{id}/events:
    get:
      operationId: streamGenerationEvents
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200':
          description: Ordered server-sent event stream
          content:
            text/event-stream: {}
  /sessions:
    post:
      operationId: startOrResumeSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courseReleaseId]
              properties:
                courseReleaseId: { type: string }
                sessionId: { type: string }
      responses:
        '201': { description: New learning session }
        '200': { description: Resumed learning session }
  /sessions/{id}/questions:
    post:
      operationId: createAnchoredQuestion
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Stored hint response }
  /pages/{id}/questions:select:
    post:
      operationId: selectPageQuestions
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Reproducible mixed question selection stored in ReadWeave }
  /pages/{id}/questions:refill:
    post:
      operationId: refillPageQuestions
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Missing draft questions added for quality review }
  /questions/{id}:retract:
    post:
      operationId: retractPageQuestion
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Question marked retracted while revision history remains }
  /questions/{id}/review-policy:
    patch:
      operationId: updateQuestionReviewPolicy
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Question included in or excluded from review evidence }
  /question-attempts:
    post:
      operationId: createQuestionAttempt
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Question attempt, feedback and mastery evidence stored }
  /costs:
    get:
      operationId: listGenerationCosts
      responses:
        '200': { description: Authoritative cost entries and hierarchical rollups }
  /assessment-attempts:
    post:
      operationId: createAssessmentAttempt
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Attempt, feedback and updated mastery }
  /review-queue:
    get:
      operationId: listReviewQueue
      responses:
        '200': { description: Due and needs-review objectives }
components:
  parameters:
    ObjectId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
